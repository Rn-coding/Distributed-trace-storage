{% extends "base.html" %}

{% block title %}Login - Trace Analysis System{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <h1>System Access</h1>
    <p>Sign in with your database user credentials</p>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="e.g. admin">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn" style="width: 100%; justify-content: center;">Sign In</button>
    </form>
    
    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.75rem; color: var(--text-muted); text-align: center;">
      Default Development Admin: <span class="mono" style="color: var(--accent-blue);">admin</span> / <span class="mono" style="color: var(--accent-blue);">admin123</span>
    </div>
  </div>
</div>
{% endblock %}
